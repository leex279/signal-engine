[project]
name = "signal-engine"
version = "0.1.0"
description = "Personal AI & Agent Signal Engine — fetches changelogs, releases, and communities, runs a typed decision pass, and writes a daily digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.1",
    "python-dateutil>=2.9.0",
    "beautifulsoup4>=4.12.3",
]

[project.scripts]
signal-engine = "signal_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
